name: offline-validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BMC_USERNAME: ''
      BMC_PASSWORD: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - run: python -m pip install -r requirements-dev.txt
      - run: python -I scripts/security_check.py
      - run: npm --prefix web/frontend ci --no-audit --no-fund
      - run: python -I scripts/check.py build-web
      - run: python -I scripts/check.py test
      - run: python -I scripts/release.py --output dist/ci
      - run: python -I scripts/check_release.py dist/ci
